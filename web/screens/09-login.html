<!-- Gran Care · Log in -->
<div class="flex flex-col items-start relative w-[390px] min-h-[844px] bg-[#f7f9ff]" id="au-login">
  <div class="flex flex-col gap-[20px] items-start p-[16px] relative w-full">
    <div class="flex flex-col gap-[8px] items-center pt-[24px] pb-[8px] w-full">
      <div class="bg-[#ebeef5] drop-shadow-[0px_1px_1px_rgba(0,0,0,0.05)] flex items-center justify-center p-[4px] rounded-[9999px]">
        <div class="relative rounded-[9999px] shrink-0 size-[80px] overflow-hidden"><img alt="Gran Care logo" class="absolute left-0 max-w-none size-full top-0" src="{{LOGO}}"></div>
      </div>
      <T lh="44px" class="fi font-bold text-[#006191] text-[36px] text-center tracking-[-0.9px] whitespace-nowrap">GRAN CARE</T>
      <T lh="24px" class="fl italic font-normal text-[#3f4850] text-[16.8px] text-center tracking-[0.168px]">Medication Management &amp; Care Coordination</T>
    </div>
    <form class="bg-white drop-shadow-[0px_1px_1px_rgba(0,0,0,0.05)] flex flex-col gap-[16px] items-start p-[20px] relative rounded-[16px] shrink-0 w-full" id="au-login-form" novalidate>
      <T lh="28px" class="fi font-semibold text-[#181c21] text-[22px] whitespace-nowrap">Log In</T>
      <div class="flex flex-col gap-[4px] items-start relative shrink-0 w-full">
        <label for="au-email"><T lh="20px" class="fi font-semibold text-[#181c21] text-[16px] tracking-[0.16px] whitespace-nowrap">Email</T></label>
        <div class="bg-[#f0f4fa] flex h-[56px] items-center px-[16px] relative rounded-[12px] shrink-0 w-full"><input id="au-email" type="email" autocomplete="email" placeholder="you@example.com" class="fi font-normal text-[18px] leading-[normal] w-full min-w-0 p-0 m-0 border-0 bg-transparent outline-none text-[#181c21] placeholder:text-[#707881]" inputmode="email" required></div>
      </div>
      <div class="flex flex-col gap-[4px] items-start relative shrink-0 w-full">
        <label for="au-pass"><T lh="20px" class="fi font-semibold text-[#181c21] text-[16px] tracking-[0.16px] whitespace-nowrap">Password</T></label>
        <div class="bg-[#f0f4fa] flex h-[56px] items-center px-[16px] relative rounded-[12px] shrink-0 w-full"><input id="au-pass" type="password" autocomplete="current-password" placeholder="Your password" class="fi font-normal text-[18px] leading-[normal] w-full min-w-0 p-0 m-0 border-0 bg-transparent outline-none text-[#181c21] placeholder:text-[#707881]" required></div>
      </div>
      <label class="flex gap-[8px] items-center cursor-pointer"><input type="checkbox" id="au-show" class="size-[20px] accent-[#006191]"><T lh="20px" class="fi font-normal text-[#3f4850] text-[14px] whitespace-nowrap">Show password</T></label>
      <T lh="20px" class="fi font-semibold text-[#ba1a1a] text-[14px] w-full" id="au-login-err"> </T>
      <button type="submit" class="bg-[#006191] drop-shadow-[0px_2px_3px_rgba(0,97,145,0.25)] flex h-[60px] items-center justify-center px-[24px] relative rounded-[16px] shrink-0 w-full" id="au-login-btn"><T lh="24px" class="fi font-bold text-[18px] text-white whitespace-nowrap" id="au-login-label">Log In</T></button>
      <button type="button" id="au-forgot" class="w-full h-[44px]"><T lh="20px" class="fi font-semibold text-[#006191] text-[16px] text-center">Forgot password?</T></button>
    </form>
    <div class="flex flex-col gap-[8px] items-center w-full pb-[32px]">
      <T lh="20px" class="fi font-normal text-[#3f4850] text-[14px] text-center">New to Gran Care?</T>
      <button type="button" data-go="signup" class="bg-[#e5e8ef] flex h-[52px] items-center justify-center px-[16px] rounded-[16px] w-full"><T lh="20px" class="fi font-semibold text-[#006191] text-[16px] text-center">Create an Account</T></button>
    </div>
  </div>
</div>
