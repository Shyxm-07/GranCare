name: Publish website (demo + "seen" alert page)

# Free hosting on GitHub Pages:
#   https://shyxm-07.github.io/GranCare/        -> the clickable demo (demo/index.html)
#   https://shyxm-07.github.io/GranCare/seen/   -> the page the son's alert SMS links to
# The site is pushed to the gh-pages branch; GitHub serves that branch automatically
# (if not, Settings > Pages > Source: "Deploy from a branch", Branch: gh-pages, / (root)).

on:
  push:
    branches: [main]
    paths: [demo/**, site/**, web/firebase-config.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p public
          cp -r site/. public/
          cp demo/index.html public/index.html
          cp web/firebase-config.js public/firebase-config.js
          touch public/.nojekyll
          find public -type f | sort

      - name: Push to the gh-pages branch
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
