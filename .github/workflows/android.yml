name: Build Android APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone:
    name: Phone app (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Build the app web bundle
        run: npm run build:app

      - name: Copy web bundle and plugins into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/GranCare-phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GranCare-phone-apk
          path: out/GranCare-phone.apk

  watch:
    name: Wear OS watch app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: wear-os
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp wear-os/app/build/outputs/apk/debug/app-debug.apk out/GranCare-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GranCare-watch-apk
          path: out/GranCare-watch.apk

  release:
    name: Publish download
    if: github.event_name != 'pull_request'
    needs: [phone, watch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gran Care build ${{ github.run_number }}
          make_latest: true
          body: |
            **Install on the phone:** download `GranCare-phone.apk` on the Android phone and open it
            (allow "Install unknown apps" for your browser or Files app when asked).

            **Watch (Wear OS):** `GranCare-watch.apk` installs with `adb install GranCare-watch.apk`
            over Wi-Fi debugging, or from Android Studio. See the README.

            Built from ${{ github.sha }}.
          files: |
            out/GranCare-phone.apk
            out/GranCare-watch.apk
